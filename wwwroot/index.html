<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bijan Pourazari | CSUMB Computer Science Portfolio</title>
    <meta name="description" content="A restored CSUMB computer science portfolio for Bijan Pourazari, rebuilt as a static Blazor WebAssembly site." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="portfolio/published/csumb-logo-black.png" />
    <link href="CSUMBPortfolioSite.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            console.log(`[FETCH] ${url}`);
            return originalFetch.apply(this, args)
                .then(response => {
                    console.log(`[FETCH OK] ${url} - ${response.status}`);
                    return response;
                })
                .catch(error => {
                    console.error(`[FETCH ERROR] ${url}`, error);
                    throw error;
                });
        };

        window.addEventListener('error', (event) => {
            console.error(`[ERROR] ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error(`[UNHANDLED REJECTION]`, event.reason);
        });

        console.log('[STARTUP] App loading...');
        console.log('[STARTUP] Window location:', window.location.href);
        console.log('[STARTUP] Base href:', document.querySelector('base')?.href);
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
